name: Setup Loudness DD build
description: Install the locked toolchain, restore the pnpm cache, and install dependencies.

inputs:
  github-token:
    description: Token used by mise when downloading tools from GitHub.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install locked toolchain
      uses: jdx/mise-action@v4
      with:
        version: 2026.7.13
        cache: true
        github_token: ${{ inputs.github-token }}

    - name: Locate pnpm store
      id: cache-paths
      shell: bash
      run: echo "pnpm-store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install workspace dependencies
      shell: bash
      run: mise run install
