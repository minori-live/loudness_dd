name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true
          github_token: ${{ github.token }}

      - name: Validate tag and version
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json does not contain a valid release version: $version"
            exit 1
          fi

          if [[ "$TAG_NAME" != "v$version" ]]; then
            echo "::error::Tag $TAG_NAME does not match package.json version ($version)."
            exit 1
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    name: Create draft GitHub release
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download extension package
        uses: actions/download-artifact@v8
        with:
          name: loudness-dd-extension
          path: release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create or update draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          release_args=(
            --verify-tag
            --generate-notes
            --title "Loudness DD $TAG_NAME"
            --draft
          )

          if existing_is_draft="$(
            gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            if [[ "$existing_is_draft" != "true" ]]; then
              echo "::error::Release $TAG_NAME is already published; refusing to overwrite it."
              exit 1
            fi

            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create \
              "$TAG_NAME" \
              release-assets/* \
              "${release_args[@]}"
          fi
